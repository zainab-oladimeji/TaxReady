steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/taxready:$SHORT_SHA", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/taxready:$SHORT_SHA"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - taxready
      - "--image=gcr.io/$PROJECT_ID/taxready:$SHORT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--set-secrets=MONGODB_URI=taxready-mongodb-uri:latest,AUTH_SECRET=taxready-auth-secret:latest,GOOGLE_CLIENT_SECRET=taxready-google-client-secret:latest"
      - "--set-env-vars=VERTEX_AI_LOCATION=europe-west4,GEMINI_MODEL=gemini-1.5-pro"

images:
  - "gcr.io/$PROJECT_ID/taxready:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
